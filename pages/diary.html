<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Optimization Meta Tags -->
  <title>My Diary — Dear Diary</title>
  <meta name="description" content="Access your private digital journal. Read past entries, customize paper styles, and capture your memories with photos and voice writing.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Firebase Compatibility CDN SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Integration -->
  <script type="module" src="../js/firebase-config.js"></script>

  <!-- Google Fonts Link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Dancing+Script:wght@600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Diary Style Sheet Link -->
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/diary.css">
</head>
<body>

  <!-- Full-Screen Entry Overlay (Fades out from black on load) -->
  <div id="fade-overlay" class="fade-overlay"></div>

  <!-- Main Diary Panel Wrapper -->
  <div class="diary-wrapper">

    <!-- 1. DIARY HOME SCREEN VIEW -->
    <div id="diary-home-view" class="diary-view active">
      <!-- Top Header -->
      <header class="diary-header">
        <a href="home.html" class="btn-back-header" id="btn-back-home">
          <span class="back-arrow">&larr;</span> Back
        </a>
        <h1 id="diary-title" class="diary-title">My Diary</h1>
        <button id="btn-add-entry" class="btn-add-entry" aria-label="New Entry">
          <span class="plus-icon">+</span>
        </button>
      </header>

      <!-- Calendar Strip -->
      <section class="calendar-strip-container">
        <div id="calendar-strip" class="calendar-strip">
          <!-- Calendar items generated by JS -->
        </div>
      </section>

      <!-- Entries List or Empty State Container -->
      <section class="entries-list-container">
        <!-- Scrollable list of entry logs -->
        <div id="entries-list" class="entries-list">
          <!-- Dynamically generated entries -->
        </div>

        <!-- Empty state fallback -->
        <div id="empty-state" class="empty-state">
          <div class="diary-illustration">📖</div>
          <h2 class="empty-title">Your story starts here</h2>
          <p class="empty-sub">Tap + to write your first entry</p>
        </div>
      </section>
    </div>

    <!-- Draggable Floating Character -->
    <div id="floating-companion" class="floating-companion">
      <span id="floating-companion-emoji" class="floating-companion-emoji">🦉</span>
      <div id="floating-speech-bubble" class="floating-speech-bubble">
        Hi Friend! 📖
      </div>
    </div>

    <!-- Bottom Fixed Navigation Tab Bar -->
    <nav class="bottom-nav">
      <!-- Home Tab -->
      <a href="pages/home.html" class="nav-tab">
        <span class="tab-dot"></span>
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Home</span>
      </a>

      <!-- Snap Tab -->
      <a href="pages/snap.html" class="nav-tab">
        <span class="tab-dot"></span>
        <span class="tab-icon">📸</span>
        <span class="tab-label">Snap</span>
      </a>

      <!-- Elevated Center Diary Tab (Active) -->
      <a href="pages/diary.html" class="nav-tab active center-diary-tab">
        <div class="diary-circle" aria-label="Open Diary">
          <span class="diary-icon">📖</span>
        </div>
      </a>

      <!-- Play Tab -->
      <a href="pages/play.html" class="nav-tab">
        <span class="tab-dot"></span>
        <span class="tab-icon">🎮</span>
        <span class="tab-label">Play</span>
      </a>

      <!-- Me Tab -->
      <a href="pages/me.html" class="nav-tab">
        <span class="tab-dot"></span>
        <span class="tab-icon">👤</span>
        <span class="tab-label">Me</span>
      </a>
    </nav>

  </div>

  <!-- 2. NEW ENTRY SCREEN SLIDE-UP VIEW (Hidden by default) -->
  <div id="new-entry-screen" class="new-entry-screen">
    <!-- Toolbar Top -->
    <header class="editor-header">
      <button id="btn-close-editor" class="btn-close-editor">✕ Close</button>
      <div id="editor-date-label" class="editor-date-label">May 29, 2026</div>
      <button id="btn-save-entry" class="btn-save-entry">Save ✓</button>
    </header>

    <!-- Page Style Selector (Horizontal scroll below toolbar) -->
    <section class="page-style-selector">
      <div class="style-row">
        <!-- Classic -->
        <button class="style-option-btn active" data-style="classic">
          <div class="style-preview classic-preview"></div>
          <span class="style-name">Classic</span>
        </button>
        <!-- Vintage -->
        <button class="style-option-btn" data-style="vintage">
          <div class="style-preview vintage-preview"></div>
          <span class="style-name">Vintage</span>
        </button>
        <!-- Ruled -->
        <button class="style-option-btn" data-style="ruled">
          <div class="style-preview ruled-preview"></div>
          <span class="style-name">Ruled</span>
        </button>
        <!-- Blank -->
        <button class="style-option-btn" data-style="blank">
          <div class="style-preview blank-preview"></div>
          <span class="style-name">Blank</span>
        </button>
        <!-- Dotted -->
        <button class="style-option-btn" data-style="dotted">
          <div class="style-preview dotted-preview"></div>
          <span class="style-name">Dotted</span>
        </button>
      </div>
    </section>

    <!-- Dynamic Main Diary Editor Workspace Canvas -->
    <main id="diary-page-canvas" class="diary-page-canvas classic-style">
      <div class="diary-canvas-content" style="position: relative; width: 100%; min-height: 100%; display: flex; flex-direction: column;">
        <!-- Page Bindings (Spiral rings left side) -->
        <div class="spiral-binding-editor">
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
        </div>

        <!-- Placed Polaroid attachments container -->
        <div id="attachments-canvas" class="attachments-canvas"></div>

        <!-- Placed decorations sticker container -->
        <div id="decorations-canvas" class="decorations-canvas"></div>

        <!-- Rich Text Area -->
        <div id="text-editor" class="text-editor font-dancing" contenteditable="true" spellcheck="false"></div>
      </div>
    </main>

    <!-- Font Selector Trigger Button -->
    <button id="btn-font-selector" class="btn-font-selector" aria-label="Change Font">Aa</button>

    <!-- Live Word Count (Bottom Left) -->
    <div id="editor-word-count" class="editor-word-count">0 words</div>

    <!-- Writing Toolbar (Fixed bottom, sitting above navigation/software keyboard) -->
    <div class="writing-toolbar">
      <button class="format-btn" data-command="bold" aria-label="Bold">B</button>
      <button class="format-btn" data-command="italic" aria-label="Italic">I</button>
      <button class="format-btn" data-command="underline" aria-label="Underline">U</button>
      <button class="toolbar-tool-btn" id="tool-photo" aria-label="Add Photo">📷</button>
      <button class="toolbar-tool-btn" id="tool-voice" aria-label="Voice Write">🎙️</button>
      <button class="toolbar-tool-btn" id="tool-sticker" aria-label="Decorations">📌</button>
      <button class="toolbar-tool-btn" id="tool-style-toggle" aria-label="Page Style">🎨</button>
    </div>

    <!-- Hidden Input for File uploads -->
    <input type="file" id="photo-upload-input" accept="image/*" style="display: none;">
  </div>

  <!-- FONT SELECTOR BOTTOM SHEET -->
  <div id="font-selector-sheet" class="bottom-sheet-overlay">
    <div class="bottom-sheet-card">
      <div class="sheet-header">
        <h3>Change Font</h3>
        <button id="btn-close-font-sheet" class="btn-close-sheet">&times;</button>
      </div>
      <div class="fonts-list">
        <button class="font-option-btn active" data-font="dancing">
          <span class="font-preview font-dancing-preview">Dancing Script — Handwritten</span>
          <span class="checkmark">&#10003;</span>
        </button>
        <button class="font-option-btn" data-font="playfair">
          <span class="font-preview font-playfair-preview">Playfair Display — Elegant</span>
          <span class="checkmark">&#10003;</span>
        </button>
        <button class="font-option-btn" data-font="lato">
          <span class="font-preview font-lato-preview">Lato — Clean</span>
          <span class="checkmark">&#10003;</span>
        </button>
        <button class="font-option-btn" data-font="courier">
          <span class="font-preview font-courier-preview">Courier New — Typewriter</span>
          <span class="checkmark">&#10003;</span>
        </button>
      </div>
    </div>
  </div>

  <!-- DECORATIONS STICKER BOTTOM SHEET -->
  <div id="sticker-selector-sheet" class="bottom-sheet-overlay">
    <div class="bottom-sheet-card">
      <div class="sheet-header">
        <h3>Decorations</h3>
        <button id="btn-close-sticker-sheet" class="btn-close-sheet">&times;</button>
      </div>
      <div class="stickers-grid">
        <button class="sticker-btn" data-sticker="📌">📌 Pin</button>
        <button class="sticker-btn" data-sticker="📎">📎 Clip</button>
        <button class="sticker-btn" data-sticker="🖊️">🖊️ Tape</button>
        <button class="sticker-btn" data-sticker="⭐">⭐ Star</button>
        <button class="sticker-btn" data-sticker="❤️">❤️ Heart</button>
        <button class="sticker-btn" data-sticker="🌟">🌟 Sparkle</button>
        <button class="sticker-btn" data-sticker="✨">✨ Glitter</button>
        <button class="sticker-btn" data-sticker="🎀">🎀 Ribbon</button>
      </div>
    </div>
  </div>

  <!-- VOICE WRITING OVERLAY -->
  <div id="voice-overlay" class="voice-overlay">
    <div class="voice-panel">
      <span id="voice-companion-avatar" class="voice-companion-avatar">🦉</span>
      <h2 class="voice-listening-title">I am listening...</h2>
      
      <!-- Mic Pulsing circle -->
      <div class="mic-pulse-container">
        <div class="mic-wave"></div>
        <div class="mic-wave"></div>
        <button id="btn-mic-record" class="btn-mic-record" aria-label="Start recording">
          <span class="mic-icon">🎙️</span>
        </button>
      </div>

      <!-- Real-time Speech transcription card -->
      <div class="transcription-card">
        <p id="transcription-text" class="transcription-text">Speak now. Your words will appear here...</p>
      </div>

      <button id="btn-stop-voice" class="btn-stop-voice">Done ✓</button>
    </div>
  </div>

  <!-- MOOD BEFORE SAVE OVERLAY -->
  <div id="save-mood-overlay" class="save-mood-overlay">
    <div class="mood-popup-card">
      <h3 class="mood-popup-label">How were you feeling?</h3>
      <div class="mood-emojis-row-popup">
        <button class="popup-mood-btn" data-mood="😔">😔</button>
        <button class="popup-mood-btn" data-mood="😕">😕</button>
        <button class="popup-mood-btn" data-mood="😐">😐</button>
        <button class="popup-mood-btn" data-mood="🙂">🙂</button>
        <button class="popup-mood-btn" data-mood="😄">😄</button>
      </div>
    </div>
  </div>

  <!-- 3. ENTRY DETAILED VIEW OVERLAY SCREEN -->
  <div id="entry-detail-screen" class="entry-detail-screen">
    <!-- Top Nav -->
    <header class="detail-header">
      <button id="btn-close-detail" class="btn-close-detail">&larr; Back</button>
      <div id="detail-date-label" class="detail-date-label">May 29, 2026</div>
      <button id="btn-edit-entry" class="btn-edit-entry">Edit ✏️</button>
    </header>

    <!-- Detailed View canvas (Renders saved entries, photos, and stickers in exact positions) -->
    <main id="detail-page-canvas" class="diary-page-canvas classic-style">
      <div class="diary-canvas-content" style="position: relative; width: 100%; min-height: 100%; display: flex; flex-direction: column;">
        <!-- Spiral bindings -->
        <div class="spiral-binding-editor">
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
          <div class="spiral-ring"></div>
        </div>

        <div id="detail-attachments-canvas" class="attachments-canvas"></div>
        <div id="detail-decorations-canvas" class="decorations-canvas"></div>
        
        <!-- Read-only text viewer -->
        <div id="detail-text-viewer" class="text-editor font-dancing"></div>
      </div>
    </main>

    <!-- Bottom metadata stats -->
    <div class="detail-footer">
      <div id="detail-mood-display" class="detail-mood-display">Feeling: 😄</div>
      <div id="detail-word-count" class="detail-word-count">0 words</div>
    </div>
  </div>

  <!-- Central API Service Layer -->
  <script src="../js/api.js"></script>
  <!-- Diary Controller Script Link -->
  <script src="../js/diary.js"></script>
</body>
</html>
