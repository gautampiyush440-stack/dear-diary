<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear Diary</title>
  <meta name="description" content="A beautiful, minimal, and secure space for daily reflections.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility CDN SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1A0A00;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 96px; 
      line-height: 1;
      position: relative;
      letter-spacing: -2px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
      animation: logo-glow-anim 1.2s ease-out forwards;
      animation-delay: 0.6s;
      margin-bottom: 20px;
    }

    .logo-char {
      display: inline-block;
      background: linear-gradient(135deg, #FFE875 0%, #F7C600 50%, #B8860B 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .char-d {
      transform: translateX(-50vw);
      animation: slide-in-d 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-right: -2px;
    }

    .char-b {
      transform: translateX(50vw);
      animation: slide-in-b 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-left: -2px;
    }

    @keyframes slide-in-d {
      0% { transform: translateX(-50vw); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes slide-in-b {
      0% { transform: translateX(50vw); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes logo-glow-anim {
      0% { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 35px rgba(212, 175, 55, 0.5)); }
      100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.1)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)); }
    }

    .app-name {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: 38px;
      color: #FFD700;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(12px);
      animation: fade-in-up 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 0.7s;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.25);
    }

    @keyframes fade-in-up {
      to { opacity: 1; transform: translateY(0); }
    }

    .loader-container {
      width: 160px;
      height: 2px;
      position: relative;
      opacity: 0;
      animation: fade-in-loader 0.5s ease-out forwards;
      animation-delay: 0.8s;
    }

    @keyframes fade-in-loader {
      to { opacity: 1; }
    }

    .loader-track {
      width: 100%;
      height: 100%;
      background: rgba(184, 134, 11, 0.15);
      border-radius: 1px;
      position: relative;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #B8860B, #FFD700);
      border-radius: 1px;
      animation: fill-bar-anim 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.8s;
    }

    @keyframes fill-bar-anim {
      to { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <!-- Center Logo -->
    <div class="logo-container">
      <span class="logo-char char-d">d</span>
      <span class="logo-char char-b">b</span>
    </div>

    <!-- App Name -->
    <h1 class="app-name">Dear Diary</h1>

    <!-- 1.5s Loading Bar -->
    <div class="loader-container">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>
  </div>

  <!-- Firebase Configuration & Initialization Module -->
  <script type="module" src="js/firebase-config.js"></script>

  <script type="module">
    let authUser = null;
    let authResolved = false;

    // We wait for window.firebase to be populated by the config module
    const checkFirebaseInterval = setInterval(() => {
      if (typeof window.firebase !== 'undefined') {
        clearInterval(checkFirebaseInterval);
        
        window.firebase.auth().onAuthStateChanged((user) => {
          authUser = user;
          authResolved = true;
        });
      }
    }, 50);

    // After 2.3 seconds (0.8s delay + 1.5s fill duration), trigger redirect checks
    setTimeout(() => {
      const checkRedirect = () => {
        if (authResolved) {
          if (authUser) {
            window.location.href = 'pages/home.html';
          } else {
            window.location.href = 'pages/login.html';
          }
        } else {
          // If Auth status is not fully retrieved yet, retry in 50ms
          setTimeout(checkRedirect, 50);
        }
      };
      checkRedirect();
    }, 2300);
  </script>

</body>
</html>
